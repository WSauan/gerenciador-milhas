<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Compra - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">✈️ Gerenciador de Milhas</div>
        <div class="user-info">
            <a href="dashboard.html" style="color: white; text-decoration: none; margin-right: 15px;">Voltar</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="text-align: left; max-width: 500px; margin-top: 60px;">
            <h2 style="text-align: center;">Registrar Nova Compra</h2>
            <p style="text-align: center; margin-bottom: 20px;">Informe os dados e anexe o comprovante</p>
            
            <div id="containerFormulario">
                
                <div class="form-group">
                    <label for="cartaoId">Cartão Utilizado</label>
                    <select id="cartaoId" required>
                        <option value="">Carregando cartões...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição da Compra</label>
                    <input type="text" id="descricao" required placeholder="Ex: Notebook Dell">
                </div>

                <div class="form-group">
                    <label for="valorGasto">Valor Gasto (R$)</label>
                    <input type="number" id="valorGasto" required placeholder="0.00" step="0.01">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataCompra">Data da Compra</label>
                        <input type="date" id="dataCompra" required>
                    </div>
                    <div class="form-group">
                        <label for="dataPrevista">Previsão de Crédito</label>
                        <input type="date" id="dataPrevista" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comprovante">Comprovante (PDF ou Imagem)</label>
                    <input type="file" id="comprovante" required accept=".pdf, .jpg, .jpeg, .png" style="border: none; padding: 5px 0;">
                </div>

                <button type="button" id="btnSalvar" onclick="enviarCompra()" style="margin-top: 20px; background-color: #17a2b8;">Registrar Compra</button>
            </div>
        </div>
    </div>

    <div id="modalSucesso" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>Sucesso!</h2>
            <p id="mensagemSucesso">Sua compra foi registrada.</p>
            <button id="btnFecharModal" class="btn-modal">Voltar ao Dashboard</button>
        </div>
    </div>

    <script src="js/registro-aquisicao.js"></script>
</body>
</html>
