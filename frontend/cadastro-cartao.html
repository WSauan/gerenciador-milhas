<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cartão - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">✈️ Gerenciador de Milhas</div>
        <div class="user-info">
            <a href="dashboard.html" style="color: white; text-decoration: none; margin-right: 15px;">Voltar</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="text-align: left;">
            <h2 style="text-align: center;">Cadastrar Novo Cartão</h2>
            <p style="text-align: center; margin-bottom: 30px;">Preencha os dados do seu cartão</p>
            
            <form id="formCartao">
                
                <div class="form-group">
                    <label for="nome">Apelido do Cartão</label>
                    <input type="text" id="nome" required placeholder="Ex: Meu Nubank Ultravioleta">
                </div>

                <div class="form-group">
                    <label for="bandeiraId">Bandeira</label>
                    <select id="bandeiraId" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="programaId">Programa de Pontos</label>
                    <select id="programaId" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="saldoDePontos">Saldo Atual de Pontos</label>
                    <input type="number" id="saldoDePontos" required placeholder="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="fatorConversao">Fator de Conversão (Pontos por R$)</label>
                    <input type="number" id="fatorConversao" required placeholder="Ex: 1.0 ou 2.5" step="0.1">
                    <small style="color: #666;">Quantos pontos você ganha a cada 1 unidade de moeda gasta.</small>
                </div>

                <button type="submit" id="btnSalvar" style="margin-top: 20px;">Salvar Cartão</button>
            </form>
        </div>
    </div>

    <script src="js/cadastro-cartao.js"></script>
</body>
</html>
