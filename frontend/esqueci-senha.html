<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔒 Recuperar Senha</h2>
            <p>Informe seu e-mail para receber o link de redefinição.</p>
            
            <form id="formEsqueciSenha">
                <div class="form-group">
                    <label for="email">E-mail Cadastrado</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>

                <button type="submit" id="btnEnviar">Enviar Link</button>
            </form>

            <div class="footer">
                <a href="index.html">Voltar para o Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        document.getElementById('formEsqueciSenha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    alert('Se o e-mail estiver cadastrado, você receberá um link em instantes. Verifique seu Mailtrap!');
                    window.location.href = 'index.html';
                } else {
                    alert('Erro ao solicitar. Verifique o e-mail.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Link';
            }
        });
    </script>
</body>
</html>
