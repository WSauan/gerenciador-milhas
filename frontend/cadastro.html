<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>📝 Crie sua conta</h2>
            <p>Comece a controlar suas milhas hoje mesmo</p>
            
            <form id="formCadastro">
                
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Seu nome">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>

                <button type="button" id="btnCadastrar" onclick="realizarCadastro()" style="background-color: #28a745;">Cadastrar</button>
            </form>

            <div class="footer">
                <p>Já tem conta? <a href="index.html">Faça Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/cadastro.js"></script>
</body>
</html>
