<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">✈️ Gerenciador de Milhas</div>
        <div class="user-info">
            <a href="dashboard.html" style="color: white; text-decoration: none;">Voltar ao Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="text-align: left; margin-top: 80px;">
            <h2 style="text-align: center; margin-bottom: 20px;">👤 Meus Dados</h2>
            
            <form id="formPerfil">
                <div class="form-group">
                    <label for="email">E-mail (Não alterável)</label>
                    <input type="email" id="email" disabled style="background-color: #eee; cursor: not-allowed; color: #555;">
                </div>

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Deixe em branco para manter o atual">
                    <small style="color: #666;">Preencha apenas se quiser alterar o nome.</small>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <div class="form-group">
                    <label for="senha">Nova Senha (Opcional)</label>
                    <input type="password" id="senha" placeholder="Deixe em branco para manter a atual">
                    <small style="color: #888;">Preencha apenas se quiser alterar a senha.</small>
                </div>

                <button type="submit" id="btnSalvar" style="margin-top: 20px;">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script src="js/perfil.js"></script>
</body>
</html>
