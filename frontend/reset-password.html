<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Gerenciador de Milhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔑 Nova Senha</h2>
            <p>Crie uma nova senha para sua conta.</p>
            
            <form id="formNovaSenha">
                <div class="form-group">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" required placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label for="confirmacaoSenha">Confirme a Senha</label>
                    <input type="password" id="confirmacaoSenha" required placeholder="Repita a senha">
                </div>

                <button type="submit" id="btnSalvar">Redefinir Senha</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        // 1. Pega o token da URL (ex: reset-password.html?token=abc-123...)
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            alert('Token inválido ou não encontrado!');
            window.location.href = 'index.html';
        }

        document.getElementById('formNovaSenha').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmacao = document.getElementById('confirmacaoSenha').value;
            const btn = document.getElementById('btnSalvar');

            if (novaSenha !== confirmacao) {
                alert('As senhas não coincidem!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Salvando...';

            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        novaSenha: novaSenha,
                        confirmacaoSenha: confirmacao
                    })
                });

                if (response.ok) {
                    alert('Senha alterada com sucesso! Faça login com a nova senha.');
                    window.location.href = 'index.html';
                } else {
                    const erro = await response.text();
                    alert('Erro: Token expirado ou inválido.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Redefinir Senha';
            }
        });
    </script>
</body>
</html>
